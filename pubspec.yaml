name: book_tracking_app
description: "A book tracking PWA for managing your reading list."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  drift_flutter: ^0.2.4
  http: ^1.2.2
  go_router: ^14.8.1
  mobile_scanner: ^6.0.5
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
